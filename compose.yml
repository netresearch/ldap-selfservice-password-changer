services:
  # Creates a self-signed CA and an LDAPS server certificate on the first
  # start. osixia/openldap v2 does not generate certificates itself.
  openldap-certs:
    image: alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    entrypoint: /bin/sh
    command: /dev-certs.sh /certs
    volumes:
      - ./dev/dev-certs.sh:/dev-certs.sh:ro
      - openldap_certs:/certs
    profiles:
      - dev
      - test

  # OpenLDAP server with seeded dev users.
  # Pattern borrowed from netresearch/ldap-manager dev stack.
  openldap:
    image: osixia/openldap:2.6.15
    container_name: gopherpass-openldap
    hostname: openldap
    ports:
      - "389:389"
      - "636:636"
    environment:
      # slapd listens on the standard ports instead of the image's default
      # 3890/6360, so URLs inside and outside the container stay the same.
      OPENLDAP_URLS: "ldap://:389 ldaps://:636 ldapi:///"
      OPENLDAP_BOOTSTRAP_ORGANIZATION: "Netresearch"
      OPENLDAP_BOOTSTRAP_SUFFIX: "dc=netresearch,dc=local"
      # Despite the _HASHED suffix these take any userPassword value: a
      # {SSHA} hash or, as here for the dev stack, a cleartext value.
      # cn=admin,dc=netresearch,dc=local
      OPENLDAP_BOOTSTRAP_DATA_ROOT_PASSWORD_HASHED: "admin" # pragma: allowlist secret
      # cn=admin,cn=config — must match LDAP_CONFIG_PASSWORD on openldap-init.
      OPENLDAP_BOOTSTRAP_CONFIG_ROOT_PASSWORD_HASHED: "config" # pragma: allowlist secret
      # cn=readonly,dc=netresearch,dc=local
      OPENLDAP_BOOTSTRAP_DATA_READONLY: "true"
      OPENLDAP_BOOTSTRAP_DATA_READONLY_PASSWORD_HASHED: "readonly" # pragma: allowlist secret
      OPENLDAP_BOOTSTRAP_TLS: "true"
      # No client certificate is requested: neither the app nor any test or
      # script presents one, so "demand" would refuse every LDAPS client.
      OPENLDAP_BOOTSTRAP_TLS_VERIFY_CLIENT: "never"
      OPENLDAP_BOOTSTRAP_TLS_PROTOCOL_MIN: "3.3"
    volumes:
      # v2 bootstraps only into empty config and data directories, so these
      # volumes are not shared with the v1 ones (ldap_data, ldap_config).
      - openldap_data:/var/lib/openldap/openldap-data
      - openldap_config:/etc/openldap/slapd.d
      - openldap_certs:/container/services/openldap/assets/certs:ro
      - ./dev/seed.ldif:/container/services/openldap-bootstrap/assets/ldif/data/custom/seed.ldif:ro
    depends_on:
      openldap-certs:
        condition: service_completed_successfully
    networks:
      - ldap-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'ldapsearch -x -H ldap://localhost -b "dc=netresearch,dc=local" -D "cn=admin,dc=netresearch,dc=local" -w admin -LLL -s base dn'
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles:
      - dev
      - test

  # Applies an ACL that lets each user change their own userPassword and
  # grants the password-reset service account write access to reset others'
  # passwords (mirrors Active Directory's admin-reset capability). Runs once.
  openldap-init:
    image: osixia/openldap:2.6.15
    entrypoint: /bin/bash
    command: /setup-acl.sh ldap://openldap:389
    environment:
      # Must match OPENLDAP_BOOTSTRAP_CONFIG_ROOT_PASSWORD_HASHED on openldap.
      LDAP_CONFIG_PASSWORD: "config"
      LDAP_BASE_DN: "dc=netresearch,dc=local"
      RESET_USER_DN: "uid=password-reset,ou=People,dc=netresearch,dc=local"
    volumes:
      - ./dev/setup-acl.sh:/setup-acl.sh:ro
    depends_on:
      openldap:
        condition: service_healthy
    networks:
      - ldap-network
    profiles:
      - dev
      - test

  # Mailpit — modern MailHog replacement. Captures SMTP for local testing.
  # Web UI: http://localhost:8025   SMTP (internal): mailpit:1025
  mailpit:
    # Pinned for a reproducible dev stack. Bump deliberately — Mailpit minor
    # releases can change the SMTP/API surface.
    image: axllent/mailpit:v1.34.0
    container_name: gopherpass-mailpit
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"
    # SMTP port 1025 is only reachable on the docker network — not exposed.
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    networks:
      - ldap-network
    restart: unless-stopped
    profiles:
      - dev
      - test

  # Main application. Rebuilt from local Dockerfile so it picks up the
  # current branch's templates and JS.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gopherpass-app
    ports:
      - "${APP_PORT:-3000}:3000"
    # Dev defaults — hermetic, point at the services above. These inline values
    # take precedence over env_file, so .env.local can only supply variables
    # that are NOT listed here; to change one of these, edit it below.
    environment:
      # LDAP — least-privilege accounts (reflects production wiring).
      LDAP_SERVER: "ldap://openldap:389"
      LDAP_IS_AD: "false"
      LDAP_BASE_DN: "dc=netresearch,dc=local"
      LDAP_READONLY_USER: "cn=readonly,dc=netresearch,dc=local"
      LDAP_READONLY_PASSWORD: "readonly"
      LDAP_RESET_USER: "uid=password-reset,ou=People,dc=netresearch,dc=local"
      LDAP_RESET_PASSWORD: "reset-password"
      # Password policy
      MIN_LENGTH: "10"
      MIN_NUMBERS: "1"
      MIN_SYMBOLS: "1"
      MIN_UPPERCASE: "1"
      MIN_LOWERCASE: "1"
      PASSWORD_CAN_INCLUDE_USERNAME: "false"
      # Reset feature
      PASSWORD_RESET_ENABLED: "true"
      UNLOCK_ACCOUNT_ON_PASSWORD_RESET: "false"
      RESET_TOKEN_EXPIRY_MINUTES: "15"
      # Reset limiter only: 3/hour per typed identifier and per resolved
      # account. The per-IP limiter (10/hour) is hardcoded and unaffected.
      RESET_RATE_LIMIT_REQUESTS: "3"
      RESET_RATE_LIMIT_WINDOW_MINUTES: "60"
      # SMTP → mailpit
      SMTP_HOST: "mailpit"
      SMTP_PORT: "1025"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM_ADDRESS: "noreply@netresearch.local"
      APP_BASE_URL: "http://localhost:3000"
    env_file:
      # Optional fallback for variables absent from `environment:` above.
      # Compose v2 treats missing files as empty when `required: false` is set.
      - path: .env.local
        required: false
    depends_on:
      openldap-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    networks:
      - ldap-network
    profiles:
      - dev
      - test

volumes:
  openldap_data:
    driver: local
  openldap_config:
    driver: local
  openldap_certs:
    driver: local

networks:
  ldap-network:
    driver: bridge
