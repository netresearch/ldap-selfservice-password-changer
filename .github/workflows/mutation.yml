name: Mutation Testing

on:
  schedule:
    - cron: '0 2 * * 0'
  pull_request:
    paths:
      - '**.go'
      - '.gremlins.yaml'
      - '.github/workflows/mutation.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: mutation-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    uses: netresearch/.github/.github/workflows/go-mutation-testing.yml@main
    with:
      diff-only: ${{ github.event_name == 'pull_request' }}
      # The Go packages embed CSS that bun builds; without it gremlins cannot
      # gather coverage. Same pre-build as ci.yml, including the go.mod that
      # keeps node_modules out of `go test ./...`.
      setup-bun: true
      pre-build-cmd: "bun install --frozen-lockfile && bun run build:assets && printf 'module nodemodules\\n\\ngo 1.26\\n' > node_modules/go.mod"
    permissions:
      contents: read
      pull-requests: write
