name: Companion checks

on:
  pull_request:
    branches: [main]
    paths:
      - "internal/web/static/companion/**"
      - "internal/web/static/logo.webp"
      - "tests/companion/**"
      - ".github/workflows/companion-checks.yml"
  push:
    branches: [main]
    paths:
      - "internal/web/static/companion/**"
      - "tests/companion/**"
  merge_group:

permissions: {}

jobs:
  browser:
    name: Companion browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install Playwright
        working-directory: tests/companion
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Run companion checks
        working-directory: tests/companion
        run: npm test
